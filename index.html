<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debt Tracker GenZ</title>
<style>
body{
font-family:Arial,sans-serif;
margin:0;
padding:0;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:#fff;
}
.wrap{
max-width:430px;
margin:auto;
padding:16px;
}
.header{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
padding:18px;
border-radius:20px;
margin-bottom:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}
h2{margin:0}
p{font-size:12px;color:#cbd5e1}
input,button{
width:100%;
padding:14px;
border-radius:14px;
border:none;
margin-bottom:10px;
box-sizing:border-box;
}
input{
background:rgba(255,255,255,0.1);
color:white;
outline:none;
}
input::placeholder{color:#94a3b8}
button{
background:linear-gradient(135deg,#6366f1,#22c55e);
color:white;
font-weight:bold;
}
.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
padding:15px;
border-radius:18px;
margin-top:12px;
box-shadow:0 8px 20px rgba(0,0,0,0.3);
}
.small{font-size:12px;color:#cbd5e1}
.totalbar{
position:sticky;
top:0;
background:rgba(15,23,42,0.9);
backdrop-filter:blur(10px);
padding:12px;
border-radius:14px;
margin-bottom:10px;
}
.badge{
display:inline-block;
padding:4px 10px;
border-radius:999px;
background:#22c55e;
font-size:11px;
margin-top:5px;
}
</style>
</head>
<body>
<div class='wrap'>

<div class='header'>
<h2>💸 Debt Tracker</h2>
<p>biar hidup keliatan jelas walau isi dompet tetap gelap</p>
</div>

<div class='totalbar' id='totalbar'>Total loading...</div>

<input id='gaji' type='number' placeholder='Gaji per bulan'>
<input id='nama' placeholder='Nama APK'>
<input id='cicilan' type='number' placeholder='Cicilan per bulan'>
<input id='bulan' type='number' placeholder='Sisa bulan cicilan'>
<input id='start' type='number' placeholder='Mulai bulan (opsional)'>

<button onclick='tambah()'>+ Tambah Utang</button>

<div id='hasil'></div>
</div>

<script>
let data=[]

function tambah(){
let nama=document.getElementById('nama')
let cicilan=document.getElementById('cicilan')
let bulan=document.getElementById('bulan')
let start=document.getElementById('start')

if(!nama.value||!cicilan.value||!bulan.value) return alert('isi dulu woi')

data.push({
 nama:nama.value,
 cicilan:+cicilan.value,
 bulan:+bulan.value,
 start:+start.value||1
})

nama.value=''
cicilan.value=''
bulan.value=''
start.value=''

render()
}

function render(){
let gaji=+document.getElementById('gaji').value||0
let jadwal={}

let totalSemua=0

// build schedule

data.forEach(x=>{
 totalSemua += x.cicilan * x.bulan

 for(let i=x.start;i<x.start+x.bulan;i++){
 if(!jadwal[i])jadwal[i]=[]
 jadwal[i].push({...x,finish:x.start+x.bulan-1})
 }
})

// total monthly max
let maxMonth=0
let monthlyTotal=[]

Object.keys(jadwal).forEach(m=>{
 let sum=jadwal[m].reduce((a,b)=>a+b.cicilan,0)
 monthlyTotal.push(sum)
 if(m>maxMonth) maxMonth=+m
})

let avgMonthly = monthlyTotal.length ? (monthlyTotal.reduce((a,b)=>a+b,0)/monthlyTotal.length) : 0

// total bar

document.getElementById('totalbar').innerHTML=`
💰 Total Utang: Rp ${totalSemua.toLocaleString()} <br>
📊 Rata-rata cicilan/bln: Rp ${avgMonthly.toLocaleString()} <br>
🔥 Puncak beban: Rp ${Math.max(...monthlyTotal,0).toLocaleString()}
`

let html=''

Object.keys(jadwal).sort((a,b)=>a-b).forEach(bln=>{
let total=jadwal[bln].reduce((a,b)=>a+b.cicilan,0)
let selesai=jadwal[bln].filter(x=>x.finish==bln)

html+=`
<div class='card'>
<h3>📅 Bulan ${bln}</h3>
<div>Total Cicilan: Rp ${total.toLocaleString()}</div>
<div>Sisa Gaji: Rp ${(gaji-total).toLocaleString()}</div>
<div class='small'>${jadwal[bln].map(x=>`• ${x.nama} Rp ${x.cicilan.toLocaleString()} (s.d bln ${x.finish})`).join('<br>')}</div>
${selesai.length?`<div class='badge'>Lunas: ${selesai.map(x=>x.nama).join(', ')}</div>`:''}
</div>
`
})

document.getElementById('hasil').innerHTML=html
}
</script>
</body>
</html>
